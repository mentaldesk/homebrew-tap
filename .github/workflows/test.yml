name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: brew audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        # Auto-taps the checked-out repo as mentaldesk/tap.
        uses: Homebrew/actions/setup-homebrew@main

      - name: brew style
        run: brew style mentaldesk/tap

      - name: brew audit --strict --online
        run: |
          for formula in Formula/*.rb; do
            brew audit --strict --online "mentaldesk/tap/$(basename "$formula" .rb)"
          done

  install:
    name: brew install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 macOS only — Intel Macs are EOL upstream so no osx-x64 build.
        # Linux runners exercise the linux-x64 / linux-arm64 tarballs.
        runner: [macos-14, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        # Auto-taps the checked-out repo as mentaldesk/tap.
        uses: Homebrew/actions/setup-homebrew@main

      - name: brew install, test, uninstall
        run: |
          for formula in Formula/*.rb; do
            name="mentaldesk/tap/$(basename "$formula" .rb)"
            brew install --verbose "$name"
            brew test "$name"
            brew uninstall "$name"
          done
